[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-schedule"
version = "0.1.0"
description = "JSON programme data and build tools for the conference schedule site"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
